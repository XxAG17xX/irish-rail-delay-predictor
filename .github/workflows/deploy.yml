name: Build and deploy the site

# Push to main and the site is checked, built and published. No AWS key exists anywhere in
# this repository or in GitHub's secrets: the job asks GitHub for a short lived token that
# says which repo and branch it is, and AWS trades that for temporary credentials scoped to
# the site bucket alone. See infra/github-oidc.yaml for the trust condition that enforces it.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "styles/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # required to mint the OIDC token; without it the AWS step cannot assume

env:
  AWS_REGION: eu-west-1
  SITE_STACK: rail-delay-site
  # Written here rather than read from a repository variable. Neither is a secret: a role
  # ARN is an identifier and the trust policy is what grants anything, and the site domain
  # is on every page. Both come from CloudFormation outputs and change only when a stack is
  # recreated. A variable added an invisible place for the value to be wrong, and the
  # failure it produced was "Not authorized to perform sts:AssumeRoleWithWebIdentity",
  # which names neither the value nor the variable.
  DEPLOY_ROLE_ARN: arn:aws:iam::707865775405:role/rail-delay-ci-github-deploy
  SITE_DOMAIN: dc9icf7494up8.cloudfront.net

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Compile the stylesheet
        run: npm run css

      # The committed CSS must match what the source compiles to, or the deployed site and
      # the repository disagree about what it looks like and nobody notices until a redeploy.
      - name: The committed stylesheet is up to date
        run: git diff --exit-code -- site/app.css

      - name: Type check
        run: npm run typecheck

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-api.txt

      # api.py imports lightgbm, numpy, fastapi and requests at module scope, so its
      # self-check cannot run on a bare interpreter. Installing the real serving set here
      # is not overhead: it also proves the pinned versions still resolve together, which
      # is the thing that breaks a deploy weeks after anyone touched it.
      - name: Install the serving dependencies
        run: pip install -r requirements-api.txt

      # The self-checks each module carries. No AWS access, no network, no model artifact:
      # they exercise the pure logic, which is what makes them safe to run on every push.
      - name: Self-checks
        run: |
          python src/ratelimit.py
          python src/prediction_log.py
          python src/api.py
          python src/generate.py

      # Lighthouse checks contrast too, but the audit job runs after the deploy job, so a
      # failing colour reaches the live site and is reported afterwards. This reads the same
      # tokens and fails here instead. It found the palette shipping labels at 4.07:1.
      - name: Colour contrast
        run: python scripts/contrast.py

      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/
          retention-days: 1

  deploy:
    name: Deploy
    needs: check
    runs-on: ubuntu-latest
    # Deliberately no `environment:` here. Declaring one changes the OIDC token's own
    # subject claim from
    #     repo:<owner>/<repo>:ref:refs/heads/main
    # to
    #     repo:<owner>/<repo>:environment:production
    # so the role in infra/github-oidc.yaml stops trusting it and STS refuses with
    # "Not authorized to perform sts:AssumeRoleWithWebIdentity". Adding an environment
    # would mean changing that trust condition to match, and restricting the environment
    # to this branch in the repository settings to get the branch guarantee back. It buys
    # a deployment history and nothing else here, so it is not worth the second place for
    # the two to disagree.
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      # "Not authorized to perform sts:AssumeRoleWithWebIdentity" is returned both when the
      # subject claim does not match the trust policy and when the role ARN does not exist,
      # and it names neither. This prints the three things that have to agree, so the next
      # failure is diagnosable from the log instead of from a theory. None of it is secret:
      # a role ARN is an identifier, and the repository and ref are already public.
      - name: What this job will present to AWS
        run: |
          echo "repository : ${{ github.repository }}"
          echo "ref        : ${{ github.ref }}"
          # NOT repo:<owner>/<repo>:ref:... . GitHub sends numeric owner and repo ids in the
          # subject and no published guide shows it, which cost four failed deploys (D72).
          # The ids are not available to this step, so print the shape and where they go.
          echo "expected sub: repo:<owner>@<ownerId>/<repo>@<repoId>:ref:${{ github.ref }}"
          echo "             ids come from api.github.com/repos/${{ github.repository }} (owner.id and id)"
          echo "             if this fails, read the real sub off CloudTrail, do not guess"
          echo "role arn    : '${{ env.DEPLOY_ROLE_ARN }}'"
          echo "repo var    : '${{ vars.AWS_DEPLOY_ROLE_ARN }}'   (unused; kept only to show whether it differs)"

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          # The action's default, stated rather than assumed: it is one half of the trust
          # condition in infra/github-oidc.yaml, and a silent default is a poor place for
          # half of a security control to live.
          audience: sts.amazonaws.com
          role-session-name: railcast-deploy

      # One query per output. A single filtered query returns the values in the order the
      # template declares them, not the order the filter names them, so reading two values
      # positionally silently swapped the bucket and the distribution id.
      - name: Read the stack outputs
        id: stack
        run: |
          set -euo pipefail
          output() {
            aws cloudformation describe-stacks \
              --stack-name "$SITE_STACK" --region "$AWS_REGION" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }
          BUCKET="$(output SiteBucket)"
          DIST="$(output DistributionId)"
          [ -n "$BUCKET" ] && [ -n "$DIST" ] || { echo "stack outputs missing"; exit 1; }
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "distribution=$DIST" >> "$GITHUB_OUTPUT"
          echo "Publishing to $BUCKET, invalidating $DIST"

      # accuracy.json is excluded on purpose: the nightly scorer owns that object, and a
      # deploy that overwrote it would put a stale scoreboard back on the site.
      - name: Publish
        run: |
          aws s3 sync site/ "s3://${{ steps.stack.outputs.bucket }}/" \
            --delete --exclude "accuracy.json" \
            --cache-control "public,max-age=300"

      - name: Invalidate the cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.stack.outputs.distribution }}" \
            --paths "/*"

  audit:
    name: Lighthouse
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true # a score is evidence, not a gate; a slow CDN edge should not fail a deploy
    steps:
      - uses: actions/checkout@v4
      - name: Audit the deployed pages
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://${{ env.SITE_DOMAIN }}/
            https://${{ env.SITE_DOMAIN }}/accuracy.html
            https://${{ env.SITE_DOMAIN }}/how-it-works.html
          # Reports are kept as a GitHub run artifact only. temporaryPublicStorage would
          # also push them to a public Google URL, which is redundant when the artifact
          # exists and puts screenshots of the site on someone else's storage.
          uploadArtifacts: true
          configPath: ./.lighthouserc.json
