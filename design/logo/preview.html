<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>RailCast logo sheet</title>
<style>
  body{margin:0;background:#EEF0EC;color:#111517;font:13px system-ui;padding:32px}
  section{display:flex;gap:40px;align-items:center;flex-wrap:wrap;padding:24px;border-radius:14px;margin-bottom:16px}
  .night{background:#0E1430;color:#C9CCEF}
  .cap{display:flex;align-items:center;gap:10px;padding:10px 18px;border-radius:999px;background:rgb(255 255 255/.6);
       backdrop-filter:blur(14px) saturate(1.4);box-shadow:inset 0 1px 0 rgb(255 255 255/.9),0 6px 24px rgb(17 21 23/.10)}
  .tab{background:#fff;border-radius:8px 8px 0 0;padding:8px 12px;display:flex;gap:8px;align-items:center;box-shadow:0 1px 2px #0002}
  .tab.dark{background:#2b2b2b;color:#ddd}
  small{display:block;color:#777;margin-top:6px}
</style></head><body>
<section>
  <div><img src="railcast-lockup.svg" height="112"><small>Lockup, 112px</small></div>
  <div><img src="railcast-lockup.svg" height="56"><small>56px</small></div>
  <div><img src="railcast-lockup.svg" height="36"><small>36px: smallest for the full lockup</small></div>
  <div><img src="railcast-lockup-compact.svg" height="28"><small>Compact, 28px</small></div>
  <div class="cap"><img src="railcast-lockup-compact.svg" height="24"><span style="color:#555;margin-left:18px">Find a station</span></div>
</section>
<section class="night">
  <div><img src="railcast-lockup-night.svg" height="112"><small>Night lockup</small></div>
  <div><img src="railcast-lockup-night.svg" height="36"><small>36px</small></div>
  <div><img src="railcast-lockup-compact-night.svg" height="28"><small>Compact, 28px</small></div>
</section>
<section>
  <div><img src="railcast-mark.svg" height="160"><small>Mark: reported, now, the range ahead</small></div>
  <div><img src="railcast-icon.svg" height="64"><small>Icon</small></div>
  <div><img src="favicon.svg" height="64"></div><div><img src="favicon.svg" height="32"></div>
  <div class="tab"><img src="favicon.svg" width="16" height="16">RailCast</div>
  <div class="tab dark"><img src="favicon.svg" width="16" height="16">RailCast</div>
</section>
</body></html>
